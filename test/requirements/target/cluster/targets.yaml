# The L3 targets. REQ_TARGET selects one; the kubeconfig's current context
# must match one of `contexts` (spec §6 preflight) or the run refuses.
#
# capabilities:
#   calico    the CNI enforces NetworkPolicy (isolation tests are meaningful)
#   probes    tests may run probe pods in the consumer namespace
#   restart   tests may kill the control-plane pod and watch it recover
#   consumers the real consumer packs (data-science-pack, checkmaite) are present
#   gateway   the control plane runs with --gateway-domain (REQ_GATEWAY_DOMAIN
#             names it), so dynamically registered clusters are reachable via
#             a Host header against the NodePort; grace gets it once its
#             overlay sets the flag
#   autoscaling
#             the control plane runs with --ray-autoscaling, so a cluster's
#             worker count is the KubeRay autoscaler's to change (ADR-0007)
#             and r06's autoscale test can watch it act
#   tenant-namespaces
#             the control plane runs with --tenant-namespaces and cluster-wide
#             RBAC, so r21 may create a tenant namespace and map a project to it
#   store-loss
#             tests may destroy the control plane's store behind its back
#             (scale-to-zero + delete/re-create the data PVC) and watch it
#             recover. kind only: on grace that wipes a real deployment.
kind:
  namespace: bifrost
  probeNamespace: jupyter
  contexts: ["^kind-"]
  capabilities: [calico, probes, restart, gateway, store-loss, tenant-namespaces]
# The same kind cluster, control plane started with --ray-autoscaling (the
# l3-kind "autoscaling" shard patches the Deployment before the suite runs).
kind-autoscaling:
  namespace: bifrost
  probeNamespace: jupyter
  contexts: ["^kind-"]
  capabilities: [calico, probes, restart, gateway, autoscaling, store-loss, tenant-namespaces]
grace:
  namespace: bifrost
  probeNamespace: jupyter
  contexts: ["^microk8s$", "^grace$"]
  # gateway: grace's deployment sets --gateway-domain (bifrost-sso-values.yaml);
  # there is no wildcard HTTPRoute yet, so the lane must reach the API through
  # the in-cluster Service (BIFROST_URL=http://<clusterIP>:8484), which honours
  # the Host header — scripts/l3-grace.sh does exactly that.
  # tenant-namespaces: grace runs --tenant-namespaces with the chart's
  # tenancy.enabled ClusterRole (2026-09-17).
  capabilities: [calico, probes, restart, consumers, gateway, tenant-namespaces]
