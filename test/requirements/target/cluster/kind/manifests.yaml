# A minimal in-cluster Bifrost for the kind L3 lane. This mirrors what
# bifrost-pack's chart renders (labels, RBAC, security posture, args) so
# the lane tests the same shape grace runs — but it is NOT the chart: the
# pack lives in its own repo with no remote yet (ci.yml's TODO(pack)), and a
# CI job cannot check it out. When it can, replace this file with
# `helm install` of the pack and delete the duplication.
#
# The admin password is a fixed literal: this cluster lives for one CI run
# on an ephemeral runner and is reachable only from that runner.
apiVersion: v1
kind: Namespace
metadata:
  name: bifrost
---
# The consumer namespace: probe pods stand in for notebook pods here, and
# the control plane's per-cluster NetworkPolicy admits owners from it.
apiVersion: v1
kind: Namespace
metadata:
  name: jupyter
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bifrost
  namespace: bifrost
---
# Requirement 21 (tenant namespaces): the control plane runs with
# --tenant-namespaces, so the Ray rules are a ClusterRole — a project's
# objects live in the namespace the policy maps it to, and lists span every
# namespace. The rule set is the chart's Role verbatim; only the scope widens.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bifrost-ray
rules:
  - apiGroups: ["ray.io"]
    resources: ["rayclusters", "rayservices", "rayjobs"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # Requirement 12: an existence check (metadata only) on the Secrets the
  # storage catalog names; Bifrost never reads their data.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  # Requirement 20: an existence check (metadata only) on the ServiceAccount
  # a workload-identity rule names; Bifrost never creates or binds one.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bifrost-ray
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bifrost-ray
subjects:
  - kind: ServiceAccount
    name: bifrost
    namespace: bifrost
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bifrost-bifrost
rules:
  # Tenant namespaces (requirement 21): the posture (PSS labels) is applied
  # to whichever namespace a project maps to, and the control-plane label to
  # bifrost's own, so this is no longer narrowed to one name.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "patch"]
  # --ray-autoscaling: the autoscaler egress policy names the API server's
  # endpoint addresses, read from the kubernetes EndpointSlice in default.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    resourceNames: ["kubernetes"]
    verbs: ["get"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["clusterqueues"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["cohorts", "resourceflavors", "localqueues"]
    verbs: ["list", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bifrost-bifrost
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bifrost-bifrost
subjects:
  - kind: ServiceAccount
    name: bifrost
    namespace: bifrost
---
apiVersion: v1
kind: Secret
metadata:
  name: bifrost-local-admin
  namespace: bifrost
type: Opaque
stringData:
  BIFROST_LOCAL_ADMIN_PASSWORD: kind-l3-admin-0123456789
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bifrost-data
  namespace: bifrost
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost
  namespace: bifrost
  labels:
    app.kubernetes.io/name: bifrost-pack
    app.kubernetes.io/instance: bifrost
spec:
  replicas: 1
  strategy:
    type: Recreate   # one PVC, one SQLite writer
  selector:
    matchLabels:
      app.kubernetes.io/name: bifrost-pack
      app.kubernetes.io/instance: bifrost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bifrost-pack
        app.kubernetes.io/instance: bifrost
        bifrost.dev/control-plane: "true"
    spec:
      serviceAccountName: bifrost
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 0
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bifrost
          image: bifrost:l3
          imagePullPolicy: Never   # loaded with `kind load docker-image`
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - serve
            - --bind=0.0.0.0:8484
            - --store=sqlite
            - --db=/data/bifrost.db
            - --local-auth
            - --allow-insecure-transport
            - --namespace=bifrost
            - --tenant-namespaces
            - --reconcile-interval=10s
            - --metering-interval=15s
            # Requirement 7 (administrator controls), asserted by r07: only
            # these image prefixes, at most 4 workers per cluster.
            - --allowed-images=rayproject/,registry.k8s.io/
            - --max-workers=4
            # Requirement 5: dynamically registered clusters are exposed as
            # <name>.ray.kind.invalid; tests reach them with a Host header
            # against the NodePort (REQ_GATEWAY_DOMAIN in l3-kind.yml).
            - --gateway-domain=ray.kind.invalid
            - --gateway-external-base=http://
          env:
            - name: BIFROST_LOCAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bifrost-local-admin
                  key: BIFROST_LOCAL_ADMIN_PASSWORD
          ports:
            - name: http
              containerPort: 8484
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bifrost-data
---
# NodePort, not a port-forward: the restart tests kill the control-plane
# pod, and `kubectl port-forward` dies with the pod it attached to. The kind
# config maps hostPort 8484 to this nodePort so BIFROST_URL stays
# http://127.0.0.1:8484 for the whole run.
apiVersion: v1
kind: Service
metadata:
  name: bifrost
  namespace: bifrost
  labels:
    app.kubernetes.io/name: bifrost-pack
    app.kubernetes.io/instance: bifrost
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: bifrost-pack
    app.kubernetes.io/instance: bifrost
  ports:
    - name: http
      port: 8484
      targetPort: http
      nodePort: 30484
