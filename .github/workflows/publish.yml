name: Publish

# Publishes ghcr.io/<owner>/bifrost from the multi-stage Dockerfile.
#
# WHY THIS EXISTS: until now the repo had a Dockerfile and nothing that pushed
# it, so the only images that existed were hand-built on somebody's terminal.
# The grace deployment ran `localhost:32000/bifrost:sha-c7b0003` — an artifact
# with no automated path that produces it, and therefore not reproducible by
# anyone who was not at that terminal. That is the same shape as a fix landing
# in the Dockerfile CI does not build: the thing that runs and the thing the
# pipeline makes are different objects.
#
# TAGGING: `sha-<short>` is the identifier to deploy. `latest` is published
# too, for convenience, but treat it as a pointer rather than a version —
# `latest` plus `pullPolicy: Always` is exactly how a broken bifrost-ui image
# came back on the next pod restart after the fix had supposedly landed. A
# chart that pins a SHA tag redeploys deliberately; one that tracks `latest`
# redeploys whenever a pod happens to restart.
#
# The build needs no registry auth of its own: the Dockerfile is self-contained
# (Go modules from proxy.golang.org, bases from Docker Hub and the Red Hat
# registry, both digest-pinned in the Dockerfile itself). Single-arch amd64,
# matching where this is deployed.
#
# SUPPLY CHAIN: after each push, both images are scanned by Trivy (fails the
# run on fixable HIGH/CRITICAL), signed keyless with cosign (OIDC identity of
# the workflow run, logged to Rekor — verify with
# `cosign verify ghcr.io/<owner>/bifrost@sha256:...`), given an SPDX SBOM as a
# workflow artifact, and attested for build provenance (visible under
# https://github.com/<org>/<repo>/attestations). Everything operates on the
# pushed digest, so it covers sha-<short> and latest alike. No secrets are
# configured anywhere for this: GITHUB_TOKEN pushes, OIDC signs.
#
# WHAT THE PULL-BACK BELOW DOES AND DOESN'T PROVE. It proves the push
# succeeded, the tag resolves on the registry, and auth works. It does NOT
# prove byte-level fidelity to a separate build: `docker rmi` only untags, and
# the layers are still present locally under the co-tagged `:latest`, so the
# pull resolves instantly with no layer fetch. That is fine here — one
# Dockerfile feeds both tags in one invocation, so there is no wrong-artifact
# class for it to hide — but it is not a content check, and calling it one
# would be the same overclaim this workflow exists to avoid.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One publish at a time, and cancel nothing in flight: two overlapping runs
# can land `:latest` from the older commit after the newer `sha-*`, leaving
# the mutable tag pointing behind the immutable ones.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/bifrost

jobs:
  publish:
    permissions:
      contents: read
      packages: write
      # id-token: the OIDC token cosign keyless signing and the provenance
      # attestation exchange for a Fulcio certificate / GitHub attestation.
      # No signing key material is stored anywhere — the identity is the
      # workflow run itself (repo + ref + commit), verifiable with
      # `cosign verify` against the public Rekor transparency log.
      id-token: write
      # attestations: write the build-provenance attestation to GHCR via
      # actions/attest-build-provenance (push-to-registry: true).
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (amd64)
        run: |
          SHORT=${GITHUB_SHA::7}
          # VERSION is stamped into the binary via -ldflags (see the
          # Dockerfile), so `bifrost --version` identifies the commit it was
          # built from rather than reporting the in-source default.
          docker build \
            --build-arg VERSION="0.0.1-${SHORT}" \
            -t "$IMAGE:sha-${SHORT}" \
            -t "$IMAGE:latest" .
          docker push "$IMAGE:sha-${SHORT}"
          docker push "$IMAGE:latest"

      # A push that publishes a non-starting binary is worse than no push: it
      # looks like success. So run the image, and assert the two properties the
      # UBI9-micro runtime stage is supposed to guarantee rather than trusting
      # the base.
      #
      # NO grep/sed/awk BELOW, DELIBERATELY. ubi9-micro ships `cut`, `id`,
      # `ldd`, `cat` and `tr` — and no grep. The first version of this step was
      # `id -u | grep -qv '^0$' || fail`, which reports `FAIL: running as root`
      # on an image running as 1001, because a MISSING grep and a NON-MATCHING
      # pattern both leave a non-zero status. It would have been red forever,
      # and the red would have read as "the image is broken" rather than "the
      # test is broken" — sending someone to debug a correct artifact.
      #
      # Hence: no external tools, and each assertion first checks it actually
      # got a value. `[ "$(id -u)" != "0" ]` alone has the same defect
      # inverted — if `id` vanished, the empty string is != "0" and the check
      # passes silently.
      - name: The published image runs
        run: |
          SHORT=${GITHUB_SHA::7}
          docker rmi "$IMAGE:sha-${SHORT}" >/dev/null 2>&1 || true
          docker pull "$IMAGE:sha-${SHORT}"
          docker run --rm "$IMAGE:sha-${SHORT}" --version
          docker run --rm --entrypoint=/bin/sh "$IMAGE:sha-${SHORT}" -c '
            uid="$(id -u)"
            [ -n "$uid" ] || { echo "FAIL: could not read uid (is id missing?)"; exit 1; }
            [ "$uid" != "0" ] || { echo "FAIL: running as root"; exit 1; }

            linkage="$(ldd /usr/local/bin/bifrost 2>&1)"
            [ -n "$linkage" ] || { echo "FAIL: ldd produced nothing"; exit 1; }
            case "$linkage" in
              *"not a dynamic executable"*) : ;;
              *) echo "FAIL: dynamically linked: $linkage"; exit 1 ;;
            esac

            echo "ok: uid=$uid, statically linked"
          '

      # Everything below works on the DIGEST, not the tags. sha-<short> and
      # latest are two names for one object; the digest is the object, so a
      # scan, signature or attestation against it covers both tags, and none
      # of these steps can be confused by a tag that moved between push and
      # scan.
      - name: Resolve pushed digest
        id: img
        run: |
          SHORT=${GITHUB_SHA::7}
          REF=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-${SHORT}")
          [ -n "$REF" ] || { echo "FAIL: no RepoDigest for $IMAGE:sha-${SHORT}"; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "digest=${REF##*@}" >> "$GITHUB_OUTPUT"

      # Gate, then sign: a signature on an image with a known HIGH/CRITICAL
      # hole would attest to the wrong thing. ignore-unfixed so the gate is
      # about vulnerabilities a base-image bump can actually fix — without it
      # the lane burns red for weeks on upstream CVEs with no patch, which is
      # how teams learn to merge through red gates.
      #
      # Trivy runs as a PINNED BINARY, not aquasecurity/trivy-action or
      # setup-trivy. In March 2026 (CVE-2026-33634) an attacker force-pushed
      # 76 of trivy-action's 77 mutable version tags — 0.28.0 among them —
      # and every setup-trivy tag to credential-stealing malware, and shipped
      # a malicious trivy v0.69.4 release. The scanner in this pipeline runs
      # right after `docker login`, so a compromised scanner inherits a live
      # packages:write token: exactly the blast radius that incident had. The
      # binary here comes from an immutable GitHub release (assets cannot be
      # swapped after publish) and is verified against the release's own
      # checksums before it ever executes. Bump TRIVY_VERSION deliberately;
      # never float it.
      - name: Install Trivy (pinned, checksum-verified)
        env:
          TRIVY_VERSION: 0.71.2
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o checksums.txt "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          curl -sSfL -o "$tarball" "${base}/${tarball}"
          grep "  ${tarball}\$" checksums.txt | sha256sum --check
          tar -xzf "$tarball" trivy
          ./trivy version

      - name: Vulnerability scan (fails on HIGH/CRITICAL)
        run: |
          "$RUNNER_TEMP/trivy" image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "${{ steps.img.outputs.ref }}"

      - uses: sigstore/cosign-installer@v3

      # Keyless: the OIDC identity of this workflow run is bound into a
      # short-lived Fulcio certificate and logged to Rekor. There is no key
      # to rotate, leak, or find in a junior dev's home directory.
      - name: Sign image (cosign keyless)
        run: cosign sign --yes "${{ steps.img.outputs.ref }}"

      # SBOM as a workflow artifact. anchore/sbom-action is the maintained
      # name for anchore/syft-action; it uploads the artifact itself
      # (upload-artifact defaults to true) under artifact-name.
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.img.outputs.ref }}
          artifact-name: sbom-bifrost.spdx.json

      - name: Build-provenance attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/bifrost
          subject-digest: ${{ steps.img.outputs.digest }}
          push-to-registry: true

  # The requirement suite as an image (Dockerfile.test), so the cluster can run
  # the same lane the grace script runs from a laptop. Separate job, same
  # commit: the two images are versioned together, and a deployment pins the
  # tag matching the control plane it is testing.
  publish-test-image:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the test image (amd64)
        env:
          TEST_IMAGE: ghcr.io/${{ github.repository_owner }}/bifrost-test
        run: |
          SHORT=${GITHUB_SHA::7}
          docker build -f Dockerfile.test \
            -t "$TEST_IMAGE:sha-${SHORT}" \
            -t "$TEST_IMAGE:latest" .
          docker push "$TEST_IMAGE:sha-${SHORT}"
          docker push "$TEST_IMAGE:latest"

      # The suite's own entrypoint says what it needs, so running it with
      # nothing configured is a cheap check that the image is complete: it must
      # reach the REQ_TARGET error, which means the binary loaded, its embedded
      # data parsed and the runtime base carries everything it links against. A
      # missing binary or a broken base fails differently, and loudly.
      - name: The published test image runs
        env:
          TEST_IMAGE: ghcr.io/${{ github.repository_owner }}/bifrost-test
        run: |
          SHORT=${GITHUB_SHA::7}
          out=$(docker run --rm "$TEST_IMAGE:sha-${SHORT}" 2>&1 || true)
          echo "$out"
          case "$out" in
            *"REQ_TARGET is required"*) echo "ok: reqrun starts and validates its input" ;;
            *) echo "FAIL: unexpected output from reqrun"; exit 1 ;;
          esac
          # And the packages are actually in the image, not silently zero.
          count=$(docker run --rm --entrypoint=/bin/sh "$TEST_IMAGE:sha-${SHORT}" -c \
            'set -- /usr/local/lib/bifrost-requirements/*.test; echo $#')
          echo "packages: $count"
          [ "$count" -ge 12 ] || { echo "FAIL: expected at least 12 test binaries"; exit 1; }

      # Same supply-chain treatment as the control-plane image, for the same
      # reason: the in-cluster CronJob pulls this image by tag, and a scanned,
      # signed, attested digest is the difference between "the suite image"
      # and "whatever was on the runner that night". See the publish job for
      # the full rationale; comments here stay terse.
      - name: Resolve pushed digest
        id: img
        env:
          TEST_IMAGE: ghcr.io/${{ github.repository_owner }}/bifrost-test
        run: |
          SHORT=${GITHUB_SHA::7}
          REF=$(docker inspect --format '{{index .RepoDigests 0}}' "$TEST_IMAGE:sha-${SHORT}")
          [ -n "$REF" ] || { echo "FAIL: no RepoDigest for $TEST_IMAGE:sha-${SHORT}"; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "digest=${REF##*@}" >> "$GITHUB_OUTPUT"

      - name: Install Trivy (pinned, checksum-verified)
        env:
          TRIVY_VERSION: 0.71.2
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o checksums.txt "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          curl -sSfL -o "$tarball" "${base}/${tarball}"
          grep "  ${tarball}\$" checksums.txt | sha256sum --check
          tar -xzf "$tarball" trivy
          ./trivy version

      - name: Vulnerability scan (fails on HIGH/CRITICAL)
        run: |
          "$RUNNER_TEMP/trivy" image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "${{ steps.img.outputs.ref }}"

      - uses: sigstore/cosign-installer@v3

      - name: Sign image (cosign keyless)
        run: cosign sign --yes "${{ steps.img.outputs.ref }}"

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.img.outputs.ref }}
          artifact-name: sbom-bifrost-test.spdx.json

      - name: Build-provenance attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/bifrost-test
          subject-digest: ${{ steps.img.outputs.digest }}
          push-to-registry: true
