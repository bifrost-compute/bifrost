name: ci
on:
  push: { branches: [main] }
  pull_request:
env:
  CGO_ENABLED: "0"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: golangci/golangci-lint-action@v8
        with: { version: v2.13.2 }
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIFROST_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: api + client codegen drift (ADR-0002 spec-first contract)
        run: |
          go generate ./internal/api/... ./pkg/client/...
          git diff --exit-code -- internal/api/zz_generated_api.go pkg/client/zz_generated_client.go
      - name: no-cgo build posture
        run: CGO_ENABLED=0 go build ./...
      - name: race tests + coverage (incl. live Postgres store backend)
        run: CGO_ENABLED=1 go test -race -count=2 -covermode=atomic -coverprofile=coverage.txt ./...
      - name: tiered coverage ratchet (spec §4)
        run: go run ./test/requirements/cmd/covreport -profile coverage.txt
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
  requirements-l2:
    # Spec §3: the requirement suite against the in-process target, on every
    # push, merge-blocking. Regenerates the traceability matrix and fails if
    # the committed one differs, so docs/requirements/ is always the truth
    # of the last run. -allow-untested is P0-only; the P1 plan removes it.
    #
    # TODO(pack): check out bifrost-pack and set PACK_CHART once the pack
    # has a remote; test/requirements/pack skips with a recorded reason
    # until then.
    #
    # The regenerated matrix is also published as a build artifact (below),
    # not just diffed against docs/requirements/: on a red run the diff
    # step is skipped by default (its condition is success()), and without
    # this the regenerated docs/requirements/ would exist only on the
    # ephemeral runner's disk, never surfaced to anyone looking at the run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: L2 requirement suite
        run: CGO_ENABLED=1 REQ_TARGET=inproc go test -race -count=1 -json ./test/requirements/... > l2.json
      - name: Regenerate traceability
        if: always()
        run: go run ./test/requirements/cmd/reqreport -in l2.json -lane l2 -out docs/requirements -allow-untested
      - name: Committed matrix must match
        if: always()
        run: git diff --exit-code -- docs/requirements/
      - name: Upload regenerated matrix
        if: always()
        uses: actions/upload-artifact@v7
        with: { name: traceability-l2, path: docs/requirements/, if-no-files-found: error }
  nilaway-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go run go.uber.org/nilaway/cmd/nilaway@v0.0.0-20260808063849-8649a03c818a ./... || true
