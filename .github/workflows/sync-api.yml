name: Sync API contract

# internal/api/openapi.json is the source of truth for the Bifrost REST
# contract (ADR-0006). bifrost-api (github.com/bifrost-compute/bifrost-api) is a
# downstream publish target: it hosts the published copy and the SDK
# pipeline, and its generate.yml regenerates and publishes the TS/Python
# clients on every push to its main that touches openapi.json. This
# workflow is what makes that push happen.
#
# Direction: bifrost -> bifrost-api, never back. Nobody edits openapi.json in
# bifrost-api by hand; the change is made in bifrost, in the same PR as the
# handler that implements it, and lands here when that PR merges to main.
#
# Requires the repo secret BIFROST_API_PUSH_TOKEN (contents: write on
# bifrost-compute/bifrost-api; GITHUB_TOKEN cannot push cross-repo). Unlike the
# predecessor template this was modelled on, a missing token is a HARD failure:
# a main push is expected to publish, and a silent skip would leave
# bifrost-api's SDKs quietly behind the server (SPEC.md "Port governance",
# "silent incompatibility is not admissible").
#
# Pushes directly to bifrost-api main rather than opening a PR: that repo
# has no branch protection, and its generate.yml is triggered by `push:
# main` on openapi.json — a PR would need an auto-merge step and a second
# token to achieve the same thing.
on:
  push:
    branches: [main]
    paths:
      - "internal/api/openapi.json"
      - ".github/workflows/sync-api.yml"
  workflow_dispatch:

# Two merges to main in quick succession must not race each other's push to
# bifrost-api; the later one waits and then finds the earlier one's commit
# already there. cancel-in-progress is deliberately off — a queued run is
# never wrong, it just re-derives the same state.
concurrency:
  group: sync-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Require the push token
        env:
          TOKEN: ${{ secrets.BIFROST_API_PUSH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::BIFROST_API_PUSH_TOKEN is not set — cannot publish the contract to bifrost-compute/bifrost-api. This is a hard failure, not a skip: without it bifrost-api's SDKs drift behind the server." >&2
            exit 1
          fi

      - name: Clone bifrost-api
        env:
          TOKEN: ${{ secrets.BIFROST_API_PUSH_TOKEN }}
        run: |
          git clone --quiet --depth 1 --branch main \
            "https://x-access-token:${TOKEN}@github.com/bifrost-compute/bifrost-api.git" out

      - name: Copy the contract and render its YAML companion
        # openapi.yaml is the same document re-serialized; bifrost-api's README
        # documents it for tools that prefer YAML, so it is regenerated from
        # the JSON on every sync rather than maintained separately.
        run: |
          cp internal/api/openapi.json out/openapi.json
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          cd out
          # One line on purpose: a multi-line program inside a quoted -c
          # string would carry this file's indentation into Python.
          python3 -c 'import json, yaml; yaml.safe_dump(json.load(open("openapi.json")), open("openapi.yaml", "w"), sort_keys=False, default_flow_style=False, allow_unicode=True, width=100000)'

      - name: Commit and push (no-op if unchanged)
        working-directory: out
        run: |
          git add openapi.json openapi.yaml
          if git diff --cached --quiet; then
            echo "contract unchanged in bifrost-api; nothing to push"
            exit 0
          fi
          git config user.name "bifrost-ci"
          git config user.email "ci@bifrost.invalid"
          git commit --quiet -m "chore: sync contract from bifrost@${GITHUB_SHA::7}" \
            -m "Pushed by bifrost's sync-api.yml from https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}. internal/api/openapi.json in bifrost is the source of truth (bifrost ADR-0006); do not edit this file here."
          git push --quiet origin HEAD:main
          echo "pushed $(git rev-parse --short HEAD) to bifrost-compute/bifrost-api main"
