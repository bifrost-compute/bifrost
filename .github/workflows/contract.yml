name: Contract

# The Jobs-API drift alarm (Wave 1 T14/T16, ported from the Rust predecessor's
# contract.yml): the real Python JobSubmissionClient replayed through the
# bifrost gateway against a live Ray head. Runs weekly (to catch new Ray
# releases moving the surface underneath us) and on demand — deliberately
# NOT on push/PR (unlike the Rust predecessor's contract.yml, which also runs on every
# push to crates/contract/workflow paths): a real `ray start --head` is
# too heavy to run on every PR in this repo's CI posture, so the fast
# ci.yml race/lint/vuln gates carry PR-time confidence and this workflow
# is the periodic (plus on-demand) deep check.
#
# Matrix policy (mirrors the Rust predecessor): the latest TWO Ray minor releases, each
# pinned to a concrete patch, crossed with Ray token auth off/on (Ray
# >=2.52 native token auth: head started with RAY_AUTH_MODE=token, stock
# client presenting RAY_AUTH_TOKEN). When a new Ray minor ships, bump the
# matrix below to the two newest minors (one pinned patch each) — no
# other change should be needed.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  jobs-api:
    runs-on: ubuntu-latest
    name: "ray ${{ matrix.ray }} / token auth ${{ matrix.token_auth }}"
    strategy:
      fail-fast: false
      matrix:
        # Supported-version matrix: latest two Ray minors, pinned to a
        # patch each (verified against ray-project/ray releases).
        ray: ["ray[default]==2.57.0", "ray[default]==2.56.1"]
        token_auth: ["off", "on"]
    steps:
      - uses: actions/checkout@v7

      - name: Generate the token-auth leg's shared token
        # A fresh random token per run (secrets.token_hex(32) shape — same
        # as `ray get-auth-token --generate`). CI-only: the cluster and
        # gateway live and die inside one ephemeral runner. Never a
        # committed literal.
        run: echo "RAY_CONTRACT_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ray
        run: |
          pip install "${{ matrix.ray }}"
          python -c "import ray; print('ray', ray.__version__)"

      - name: Start Ray head
        run: |
          AUTH_CURL=()
          if [ "${{ matrix.token_auth }}" = "on" ]; then
            # Ray >=2.52 native token auth: the head enforces a Bearer
            # token on every dashboard/job-API request.
            export RAY_AUTH_MODE=token
            export RAY_AUTH_TOKEN="$RAY_CONTRACT_TOKEN"
            AUTH_CURL=(-H "Authorization: Bearer $RAY_AUTH_TOKEN")
          fi
          ray start --head --dashboard-host=127.0.0.1 --dashboard-port=8265
          # Wait for the dashboard job API to come up.
          for i in $(seq 1 30); do
            curl -sf "${AUTH_CURL[@]}" http://127.0.0.1:8265/api/version && break || sleep 2
          done

      - name: Start bifrost gateway in front of it
        run: |
          echo "127.0.0.1 demo.ray.test" | sudo tee -a /etc/hosts
          # ADR-0002/registry.go's json tags are the registry file's wire
          # format (JSON, not the Rust predecessor's clusters.toml).
          if [ "${{ matrix.token_auth }}" = "on" ]; then
            # The gateway holds the cluster token and presents it
            # southbound (internal/api/gateway.go, internal/api/gateway_ws.go).
            # The registry refuses a token over cleartext http without the
            # explicit insecure-transport override — fine for loopback CI.
            cat > clusters.json <<EOF
          {"clusters": [{"id": "demo", "hostname": "demo.ray.test", "api_base_url": "http://127.0.0.1:8265", "auth_token": "$RAY_CONTRACT_TOKEN"}]}
          EOF
            EXTRA_FLAGS="--allow-insecure-transport --allow-private-endpoints"
          else
            cat > clusters.json <<'EOF'
          {"clusters": [{"id": "demo", "hostname": "demo.ray.test", "api_base_url": "http://127.0.0.1:8265"}]}
          EOF
            EXTRA_FLAGS="--allow-private-endpoints"
          fi
          # Both legs point the registry at a loopback literal IP (the local
          # ray head): F6 refuses those by default, so the replay opts in
          # with --allow-private-endpoints explicitly.
          # Reconciled against cmd/bifrost (Wave 1 T15): `bifrost serve`
          # really does take --bind/--registry/--dev-allow-unauthenticated/
          # --allow-insecure-transport with exactly these names, and the
          # registry file really is JSON shaped like core.ClusterEndpoint's
          # json tags (id/hostname/api_base_url/auth_token) — see T15's
          # task report for why JSON (not the Rust predecessor's clusters.toml) is the
          # right call. --store/--db (sqlite/postgres/memory) default to
          # "memory", which is all this gateway-only replay needs.
          go build -o ./bifrost-bin ./cmd/bifrost
          nohup ./bifrost-bin serve --bind 0.0.0.0:8484 --registry clusters.json --dev-allow-unauthenticated $EXTRA_FLAGS \
            > bifrost.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8484/healthz && break || sleep 1
          done

      - name: Replay JobSubmissionClient through the gateway
        env:
          BIFROST_ADDRESS: "http://demo.ray.test:8484"
        run: |
          if [ "${{ matrix.token_auth }}" = "on" ]; then
            # Stock client picks these up itself: with RAY_AUTH_MODE=token
            # it attaches `Authorization: Bearer $RAY_AUTH_TOKEN` to every
            # request (ray._private.authentication.http_token_authentication).
            export RAY_AUTH_MODE=token
            export RAY_AUTH_TOKEN="$RAY_CONTRACT_TOKEN"
          fi
          echo "replay leg: ${{ matrix.ray }} token_auth=${{ matrix.token_auth }}"
          # contract/jobs_client_replay.py is copied VERBATIM from the Rust predecessor
          # (see the file's own header) — it reads BIFROST_ADDRESS, not a
          # bifrost-specific env var name, by construction.
          python contract/jobs_client_replay.py

      - name: Gateway logs
        if: always()
        run: cat bifrost.log || true
