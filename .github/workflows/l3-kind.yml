# L3: the requirement suite against real Kubernetes with an enforcing CNI
# (spec §3). Nightly, on demand, and on pull requests that touch what it
# exercises. Not merge-blocking (spec §3 — L2 is); its traceability matrix is
# published as an artifact, not committed.
name: l3-kind
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}
  pull_request:
    paths:
      - "test/requirements/**"
      - "internal/provision/**"
      - "internal/controller/**"
      - "internal/app/**"
      - "cmd/bifrost/**"
      - "Dockerfile"
      - ".github/workflows/l3-kind.yml"
# A new push to the same ref cancels the previous run: the lane is long and
# a superseded run tells nobody anything.
concurrency:
  group: l3-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind-calico:
    # The suite provisions dozens of real RayClusters, RayJobs and
    # RayServices; on one 4-vCPU runner that no longer fits any timeout.
    # Sharded: every shard is its own kind cluster running a slice of the
    # requirement packages; `report` merges the shards' go test -json into
    # one traceability matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: rbac-selfserve
            pkgs: ./test/requirements/r03_rbac/... ./test/requirements/r06_self_serve/... ./test/requirements/r17_slurm/...
          - name: jobs-cleanup
            pkgs: ./test/requirements/r05_ephemeral_rayjob/... ./test/requirements/r08_cleanup/... ./test/requirements/r10_nebi_envs/...
          - name: serving
            pkgs: ./test/requirements/r01_serve_from_jupyter/... ./test/requirements/r02_group_serving/... ./test/requirements/r04_serving_pool/... ./test/requirements/r13_pools/...
          - name: governance
            pkgs: ./test/requirements/contract/... ./test/requirements/r07_admin_controls/... ./test/requirements/r12_private_storage/... ./test/requirements/r14_usage/... ./test/requirements/r15_health/... ./test/requirements/r16_dask/... ./test/requirements/r18_baseline/... ./test/requirements/pack/...
          # The control plane with --ray-autoscaling: the one configuration
          # nothing ran before 2026-09-08, when it turned out the autoscaler
          # sidecar could not reach the API server through the tenant
          # posture. Runs r06 — its autoscale test needs this target — so the
          # path stays proven.
          - name: autoscaling
            pkgs: ./test/requirements/r06_self_serve/...
            # Only the test that needs the flag: the rest of r06 already runs
            # in rbac-selfserve, and a test that ran in two shards is what the
            # matrix merger refuses.
            run: TestAutoscaler
            target: kind-autoscaling
            autoscaling: "true"
    env:
      KIND_CLUSTER: bifrost-l3
      BIFROST_URL: http://127.0.0.1:8484
      BIFROST_ADMIN_PASSWORD: kind-l3-admin-0123456789   # test/requirements/target/cluster/kind/manifests.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }

      - name: Build the control-plane image
        run: docker build -t bifrost:l3 --build-arg VERSION=l3-${GITHUB_SHA::7} .

      - name: Create kind cluster (no default CNI)
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}
          config: test/requirements/target/cluster/kind/kind-calico.yaml

      - name: Install Calico
        run: |
          kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.2/manifests/tigera-operator.yaml
          kubectl wait --for condition=established crd/installations.operator.tigera.io --timeout=120s
          kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.2/manifests/custom-resources.yaml
          for i in $(seq 1 60); do
            if kubectl get tigerastatus calico -o jsonpath='{.status.conditions[?(@.type=="Available")].status}' 2>/dev/null | grep -q True; then
              echo "Calico available"; break
            fi
            echo "  waiting for Calico ($i/60)"; sleep 5
          done
          kubectl wait --for=condition=ready node --all --timeout=180s

      - name: Load the image and pre-pull the Ray image on the node
        run: |
          kind load docker-image bifrost:l3 --name "$KIND_CLUSTER"
          # rayproject/ray is large; start the pull now so the first cluster
          # create does not spend its convergence budget downloading it.
          docker exec -d "${KIND_CLUSTER}-control-plane" crictl pull rayproject/ray:2.56.0
          docker exec -d "${KIND_CLUSTER}-control-plane" crictl pull registry.k8s.io/e2e-test-images/agnhost:2.45

      - uses: azure/setup-helm@v4

      - name: Install KubeRay and Kueue
        run: |
          helm repo add kuberay https://ray-project.github.io/kuberay-helm/
          helm install kuberay-operator kuberay/kuberay-operator --version 1.7.0 \
            -n kuberay --create-namespace --wait --timeout 4m
          helm install kueue oci://registry.k8s.io/kueue/charts/kueue --version 0.19.2 \
            -n kueue-system --create-namespace --wait --timeout 4m

      - name: Deploy Bifrost
        run: |
          # Kueue's mutating webhook for Deployments can still be coming up
          # right after `helm install --wait` returns; the first apply then
          # fails with "failed calling webhook mdeployment.kb.io". Retry.
          for i in $(seq 1 12); do
            kubectl apply -f test/requirements/target/cluster/kind/manifests.yaml && break
            echo "apply failed (attempt $i), retrying"; sleep 5
          done
          if [ "${{ matrix.shard.autoscaling }}" = "true" ]; then
            kubectl -n bifrost patch deploy bifrost --type=json \
              -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--ray-autoscaling"}]'
          fi
          kubectl -n bifrost rollout status deploy/bifrost --timeout=180s
          for i in $(seq 1 30); do curl -sf "$BIFROST_URL/healthz" && break; sleep 2; done
          curl -sf "$BIFROST_URL/api/v1/version"

      - name: L3 requirement suite
        id: suite
        env:
          REQ_TARGET: ${{ matrix.shard.target || 'kind' }}
          REQ_CONTROL_PLANE_SELECTOR: app.kubernetes.io/name=bifrost-pack
          # Head-only clusters: see fixture.WorkerReplicas.
          REQ_WORKER_REPLICAS: "0"
          # Head-only layout: the head also runs the job supervisor; Ray's memory
          # monitor OOM-kills it at 95% of a 2Gi cgroup (rbac-selfserve shard, run 33793544341).
          REQ_HEAD_MEMORY: 4Gi
          # A 4-vCPU runner starts a RayService or RayJob slowly; give convergence
          # and teardown room before calling it a failure.
          REQ_EVENTUALLY_TIMEOUT: 10m
          REQ_POSTFLIGHT_TIMEOUT: 6m
          # What manifests.yaml configured, so r07 can assert it.
          REQ_ADMISSION_DISALLOWED_IMAGE: docker.io/library/nginx:1.27
          REQ_ADMISSION_MAX_WORKERS: "4"
          # --gateway-domain in manifests.yaml (requirement 5).
          REQ_GATEWAY_DOMAIN: ray.kind.invalid
        run: |
          # One run id for every package (-p 1 runs them one at a time), so
          # preflight's leaked-cluster check and postflight's sweep agree.
          export REQ_RUN_ID="t$(printf '%x' "$GITHUB_RUN_ID")"
          CGO_ENABLED=1 go test -race -count=1 -p 1 -timeout 80m -json -run '${{ matrix.shard.run || '.' }}' ${{ matrix.shard.pkgs }} > l3.json

      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get all,networkpolicy -A -o wide || true
          kubectl -n bifrost get rayclusters,rayjobs,rayservices -o yaml || true
          kubectl -n bifrost describe pods || true
          # The tenant policies survive the tests (the control plane writes them at
          # startup), so this is the rendered operator peer; the operator pod's
          # labels, IP and hostNetwork are the other half of that rule.
          kubectl -n bifrost get networkpolicy -o yaml || true
          kubectl -n kuberay get pods -o wide || true
          kubectl -n kuberay get pods -o yaml | grep -E 'hostNetwork|podIP:|app.kubernetes.io/name|namespace:' || true
          kubectl -n bifrost logs deploy/bifrost --tail=600 || true
          # The tests delete their objects, so the operator log is the record
          # of why a RayJob/RayService failed; keep the job/service lines.
          kubectl -n kuberay logs deploy/kuberay-operator --tail=20000 \
            | grep -E 'controllers\.(RayJob|RayService)' | grep -Ev '"msg":"Reconciling' | tail -600 || true
          kubectl -n kuberay logs deploy/kuberay-operator --tail=300 || true
      - name: Upload shard results
        if: always() && steps.suite.conclusion != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: l3-kind-${{ matrix.shard.name }}
          path: l3.json
          if-no-files-found: error

  report:
    # One traceability matrix from every shard; runs even when a shard is red
    # so the matrix shows what failed.
    needs: kind-calico
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/download-artifact@v4
        with:
          pattern: l3-kind-*
          path: shards
      - name: Traceability (L3 lane, merged)
        run: |
          IN=$(ls shards/*/l3.json | paste -sd, -)
          echo "merging: $IN"
          go run ./test/requirements/cmd/reqreport -in "$IN" -lane l3 -out l3-report -allow-untested
      - uses: actions/upload-artifact@v7
        with:
          name: l3-kind
          path: |
            shards/
            l3-report/
          if-no-files-found: error
